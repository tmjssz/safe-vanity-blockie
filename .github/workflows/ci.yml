name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR, but never abandon a run on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; don't leave it in .git/config.
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec biome ci .

  build-test:
    name: build-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing is information about that version; keep the other running.
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines`; 24 is the .mise.toml pin used for development.
        # Not 20: @safe-global/safe-deployments requires >=22, and jsdom 30 needs
        # worker_threads.markAsUncloneable, which node 20 does not have.
        node: ['22', '24']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # Turbopack's compilation cache. Restored on a partial key match, so a source change reuses
      # the previous run's work instead of compiling cold.
      #
      # The globs name each source directory rather than using `packages/web/**`: this step runs
      # after the install, and hashFiles follows symlinks, so a `**` here would walk the ~16k files
      # pnpm links into packages/web/node_modules. `pnpm-lock.yaml` is likewise unglobbed — it is
      # the only lockfile in the repo, and `**/` would trigger the same walk.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/.next/cache
          key: ${{ runner.os }}-next-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/app/**', 'packages/web/components/**', 'packages/web/lib/**', 'packages/web/workers/**', 'packages/web/next.config.ts', 'packages/web/postcss.config.mjs', 'packages/web/tsconfig.json') }}
          restore-keys: ${{ runner.os }}-next-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Build MUST precede typecheck: miner/safe-config/web resolve @safe-vanity-blockie/core
      # through dist/index.d.ts, and web's tsconfig includes .next/types, generated by next build.
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: CLI packaging smoke test
        run: ./scripts/smoke-pack.sh

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both tools are single static binaries, pinned by version and verified by checksum, rather
      # than two more actions to pin — and notably not the upstream `curl | bash` installer, which
      # fetches an unpinned script from a moving branch.
      #
      # Dependabot cannot bump these; they need a manual version+checksum change. That is a milder
      # failure mode than a stale action: an out-of-date linter lints slightly less well, it does
      # not ship anything.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # Scans the composite action too, not just .github/workflows — that is where every finding
      # in this repo has been so far. Suppressions live in .github/zizmor.yml with a stated reason.
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.29.0
          ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
        run: |
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz
          ./zizmor --no-progress .github/workflows .github/actions

  # One stable name for branch protection: a matrix entry added or removed here never requires a
  # branch-protection edit. `if: always()` is what makes a skipped or cancelled job fail the gate
  # instead of silently passing it.
  ci-ok:
    name: ci-ok
    needs: [lint, lint-workflows, build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every upstream job succeeded
        # Via env rather than interpolated straight into the script: keeps the expression out of
        # the shell text, which is the pattern that stops template injection generally.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::an upstream job did not succeed ($r)"
              exit 1
            fi
          done
