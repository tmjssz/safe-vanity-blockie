name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this for a Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # The same consumer-install check CI runs. A broken tarball must be caught here, not by the
      # first person to npx the CLI.
      - name: CLI packaging smoke test
        run: ./scripts/smoke-pack.sh

      - name: Verify the tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./packages/miner/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match packages/miner version $pkg"
            exit 1
          fi

      # pnpm packs (it rewrites the workspace:* specifiers to concrete versions), npm publishes
      # (it has the OIDC trusted-publishing and --provenance support). Dependency order matters:
      # core, then safe-config, then the CLI that depends on both.
      - name: Publish
        env:
          # Empty on a tag push, which is the real-publish path. Only workflow_dispatch sets it.
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          out="$(mktemp -d)"

          # Every name@version this release is supposed to end with, for the verify step. Written
          # here rather than hard-coded there, so adding a package cannot leave it unverified.
          manifest="$RUNNER_TEMP/release-manifest.txt"
          : > "$manifest"
          pnpm --filter @safe-vanity-blockie/core        pack --pack-destination "$out"
          pnpm --filter @safe-vanity-blockie/safe-config pack --pack-destination "$out"
          pnpm --filter safe-vanity-blockie              pack --pack-destination "$out"

          # An array, not a string: an unquoted "$args" would be word-split by the shell, which
          # works but is exactly what shellcheck flags (SC2086) and breaks on any arg with a space.
          args=(--provenance --access public)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
            echo "::notice::dry run — nothing will be published"
          fi

          # Dependency order: core, then safe-config, then the CLI that depends on both.
          # The [0-9] keeps the CLI glob from matching the two scoped tarballs.
          for tgz in \
            "$out"/safe-vanity-blockie-core-*.tgz \
            "$out"/safe-vanity-blockie-safe-config-*.tgz \
            "$out"/safe-vanity-blockie-[0-9]*.tgz
          do
            meta="$(tar -xzOf "$tgz" package/package.json)"
            name="$(jq -r .name <<<"$meta")"
            version="$(jq -r .version <<<"$meta")"

            # Skip what is already on the registry. A partial failure — one package accepted, the
            # next rejected on credentials — must be recoverable by fixing the cause and re-running,
            # not by burning a version number across the whole workspace. Re-publishing an existing
            # version is an EPUBLISHCONFLICT error, which under `bash -e` would abort the step
            # before reaching the packages that still need publishing.
            #
            # `npm view <name>@<version>` exits 0 only when that exact version exists; it exits 1
            # both for an unknown package and for a known package at an unknown version. A
            # transient failure therefore reads as "not published", and the publish that follows
            # fails loudly on conflict rather than silently double-publishing.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on the registry — skipping"
              continue
            fi

            echo "publishing $name@$version"
            npm publish "$tgz" "${args[@]}"
          done

          # Skipped packages are listed too: "already there" is part of a correct end state.
          for tgz in "$out"/*.tgz; do
            tar -xzOf "$tgz" package/package.json | jq -r '"\(.name) \(.version)"' >> "$manifest"
          done
          echo "release should contain:"; cat "$manifest"

      # A green publish step only means npm did not error. This asks the registry what is actually
      # there, so "the workflow passed" means "the release is on npm", not "no command failed".
      #
      # Queries the dist-tags endpoint rather than `npm view`: right after a first publish the
      # packument endpoint that `npm view` uses can serve a cached 404 for several minutes while
      # dist-tags is already correct. Observed on this repo's own 0.3.0 release. The retry covers
      # the remaining read-after-write lag.
      - name: Verify the release is on the registry
        if: ${{ inputs.dry-run != true }}
        run: |
          manifest="$RUNNER_TEMP/release-manifest.txt"
          test -s "$manifest" || { echo "::error::no release manifest — the publish step did not run"; exit 1; }

          failed=0
          while read -r name version; do
            encoded="${name//\//%2f}"
            found=""
            for attempt in 1 2 3 4 5 6; do
              found="$(curl -fsSL "https://registry.npmjs.org/-/package/$encoded/dist-tags" 2>/dev/null | jq -r '.latest // empty')"
              [ "$found" = "$version" ] && break
              echo "  $name: registry says '${found:-<absent>}', want $version (attempt $attempt)"
              sleep 10
            done
            if [ "$found" = "$version" ]; then
              echo "  OK $name@$version"
            else
              echo "::error::$name is not at $version on the registry (latest: ${found:-<absent>})"
              failed=1
            fi
          done < "$manifest"

          [ "$failed" -eq 0 ] || exit 1
          echo "::notice::every package in this release is live on the registry"
