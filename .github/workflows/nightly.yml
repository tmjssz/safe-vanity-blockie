name: Nightly network tests

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-tests:
    name: network-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tests fall back to a public RPC with `?? 'https://…'`, which only catches
      # undefined — an unset repository variable would otherwise pass an empty string
      # straight through and break them. The default is repeated here for that reason.
      TEST_RPC_URL: ${{ vars.TEST_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Network tests
        run: pnpm -r test:network
